<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL EDITOR ODOUTORR</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Cores Escuras e Profundas com Glow Esmeralda */
            --bg-primary: #05080c;
            --bg-gradient: radial-gradient(circle at 50% 50%, #0d161f 0%, #05080c 100%);
            --bg-secondary: rgba(17, 24, 35, 0.6);
            --bg-card: rgba(27, 36, 49, 0.45);
            --accent: #10b981; /* Verde Esmeralda */
            --accent-glow: rgba(16, 185, 129, 0.25);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(45, 55, 72, 0.5);
            
            --status-todo: #ef4444;
            --status-progress: #3b82f6;
            --status-done: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-attachment: fixed;
        }

        /* Header Premium com Blur de Vidro */
        header {
            background-color: rgba(17, 24, 35, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-area i {
            color: var(--accent);
            font-size: 28px;
            filter: drop-shadow(0 0 15px var(--accent));
        }

        .logo-area h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 40%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
        }

        /* Widget de Meta Mensal no Header */
        .monthly-tracker {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .tracker-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tracker-title {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tracker-title i {
            color: #5865F2; /* Cor oficial do Discord */
        }

        .tracker-count {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }

        .tracker-count span {
            color: var(--accent);
        }

        .progress-bar-bg {
            width: 120px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 8px var(--accent);
        }

        .tracker-alert {
            font-size: 11px;
            font-weight: 600;
            color: #fbbf24;
            display: none;
            margin-top: 2px;
        }

        .tracker-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-tracker {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .btn-tracker:hover {
            background-color: rgba(16, 185, 129, 0.2);
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-add-month {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-add-month:hover {
            background-color: var(--accent);
            color: #05080c;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        /* Workspace Principal */
        main {
            flex: 1;
            padding: 40px;
            display: flex;
            gap: 30px;
            overflow-x: auto;
            align-items: flex-start;
        }

        /* Colunas Estilo Vidro (Glassmorphism) */
        .column {
            background-color: var(--bg-secondary);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            flex: 1;
            min-width: 320px;
            max-width: 400px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 180px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            transition: border-color 0.3s, background-color 0.3s;
        }

        .column:hover {
            border-color: rgba(255, 255, 255, 0.08);
        }

        .column.drag-over {
            border-color: var(--accent);
            background-color: rgba(17, 24, 35, 0.85);
        }

        .column-header {
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .column-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .column-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        .todo { color: #f87171; }
        .progress { color: #60a5fa; }
        .done { color: #34d399; }

        .todo .column-dot { background-color: var(--status-todo); color: var(--status-todo); }
        .progress .column-dot { background-color: var(--status-progress); color: var(--status-progress); }
        .done .column-dot { background-color: var(--status-done); color: var(--status-done); }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-count {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-add-card {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--accent);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .btn-add-card:hover {
            background-color: var(--accent);
            color: #05080c;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.3);
        }

        .card-list {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            flex: 1;
            min-height: 200px;
        }

        /* Cards Translúcidos com Neon Borders */
        .card {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            cursor: grab;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .card:hover {
            border-color: rgba(16, 185, 129, 0.4);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4), 0 0 15px rgba(16, 185, 129, 0.1);
        }

        .card:active {
            cursor: grabbing;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-main);
            letter-spacing: 0.3px;
        }

        /* Destaque Amarelo para Instruções de Edição */
        .card-desc {
            font-size: 13.5px;
            color: #f59e0b;
            background-color: rgba(245, 158, 11, 0.08);
            border-left: 3px solid #f59e0b;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
            font-style: italic;
        }

        .card-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .link-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: rgba(255, 255, 255, 0.03);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 600;
            text-decoration: none;
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.25s ease;
        }

        .link-badge:hover {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .link-badge.drive i {
            color: #ffc107;
            filter: drop-shadow(0 0 5px rgba(255, 193, 7, 0.3));
        }

        /* Badge Especial para arquivos Compactados (RAR/ZIP) */
        .link-badge.archive-pack {
            border-color: rgba(236, 72, 153, 0.2);
            background-color: rgba(236, 72, 153, 0.05);
        }

        .link-badge.archive-pack:hover {
            background-color: rgba(236, 72, 153, 0.15);
            border-color: rgba(236, 72, 153, 0.4);
        }

        .link-badge.archive-pack i {
            color: #ec4899;
            filter: drop-shadow(0 0 5px rgba(236, 72, 153, 0.4));
        }

        .link-badge.final {
            border-color: rgba(16, 185, 129, 0.2);
            background-color: rgba(16, 185, 129, 0.05);
        }

        .link-badge.final:hover {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.4);
        }

        .link-badge.final i {
            color: var(--accent);
            filter: drop-shadow(0 0 5px rgba(16, 185, 129, 0.4));
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 12px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-action:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        /* Modal Ultra Moderno */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(3, 5, 8, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background-color: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-title {
            font-size: 20px;
            margin-bottom: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.8px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            background-color: rgba(5, 8, 12, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 14px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.15);
            background-color: rgba(5, 8, 12, 0.8);
        }

        .modal-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 35px;
        }

        .modal-right-buttons {
            display: flex;
            gap: 14px;
        }

        .btn-cancel {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-submit {
            background-color: var(--accent);
            color: #05080c;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background-color: #34d399;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }

        .btn-delete-modal {
            background: none;
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-delete-modal:hover {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <i class="fa-solid fa-clapperboard"></i>
            <h1>PAINEL EDITOR ODOUTORR</h1>
        </div>

        <!-- Widget de Meta Mensal no topo direito -->
        <div class="monthly-tracker">
            <div class="tracker-info">
                <div class="tracker-title">
                    Saldo Acumulado <i class="fa-brands fa-discord" title="Notificações sincronizadas no painel"></i>
                </div>
                <div class="tracker-count"><span id="tracker-current">0</span> / <span id="tracker-total">8</span> Reels</div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="tracker-bar"></div>
                </div>
                <div class="tracker-alert" id="tracker-alert-msg"></div>
            </div>
            <div class="tracker-controls">
                <button class="btn-tracker" onclick="openSettingsModal()" title="Configurações e Sincronização">
                    <i class="fa-solid fa-gear"></i>
                </button>
                <button class="btn-tracker" onclick="changeTrackerCount(-1)" title="Remover 1 entregue">
                    <i class="fa-solid fa-minus"></i>
                </button>
                <button class="btn-tracker" onclick="changeTrackerCount(1)" title="Marcar 1 entregue">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <button class="btn-add-month" onclick="addNewMonthQuota()" title="Novo Mês: Adiciona +8 vídeos na meta">
                    +8
                </button>
            </div>
        </div>
    </header>

    <main>
        <!-- A FAZER -->
        <div class="column todo" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event, 'todo')">
            <div class="column-header">
                <div class="column-title">
                    <div class="column-dot"></div>
                    A Fazer
                </div>
                <div class="header-actions">
                    <span class="card-count" id="count-todo">0</span>
                    <button class="btn-add-card" onclick="openModal('add')" title="Adicionar Novo Vídeo">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>
            <div class="card-list" id="list-todo">
                <!-- Cards dinâmicos entram aqui -->
            </div>
        </div>

        <!-- EM EDIÇÃO -->
        <div class="column progress" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event, 'progress')">
            <div class="column-header">
                <div class="column-title">
                    <div class="column-dot"></div>
                    Em Edição
                </div>
                <span class="card-count" id="count-progress">0</span>
            </div>
            <div class="card-list" id="list-progress">
                <!-- Cards dinâmicos entram aqui -->
            </div>
        </div>

        <!-- CONCLUÍDO -->
        <div class="column done" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event, 'done')">
            <div class="column-header">
                <div class="column-title">
                    <div class="column-dot"></div>
                    Concluído
                </div>
                <span class="card-count" id="count-done">0</span>
            </div>
            <div class="card-list" id="list-done">
                <!-- Cards dinâmicos entram aqui -->
            </div>
        </div>
    </main>

    <!-- Modal Adicionar / Editar Vídeo -->
    <div class="modal-overlay" id="video-modal">
        <div class="modal">
            <h2 class="modal-title" id="modal-title-text">Editar Vídeo</h2>
            <form id="video-form" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="video-id">
                <div class="form-group">
                    <label for="video-name">Título do Vídeo</label>
                    <input type="text" id="video-name" placeholder="Ex: Gameplay DBD - Huntress" required>
                </div>
                <div class="form-group">
                    <label for="video-drive">Link do Vídeo Bruto (Drive)</label>
                    <input type="url" id="video-drive" placeholder="https://drive.google.com/..." required>
                </div>
                <div class="form-group">
                    <label for="video-desc">Instruções de Edição</label>
                    <textarea id="video-desc" rows="4" placeholder="Cortes aos 01:15, adicionar zoom, reações..." required></textarea>
                </div>
                <div class="form-group" id="final-link-group">
                    <label for="video-final">Link do Vídeo Finalizado</label>
                    <input type="url" id="video-final" placeholder="https://drive.google.com/...">
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-delete-modal" id="btn-delete-action" onclick="deleteVideoFromModal()">
                        <i class="fa-solid fa-trash-can"></i> Excluir
                    </button>
                    <div class="modal-right-buttons">
                        <button type="button" class="btn-cancel" onclick="closeModal()">Cancelar</button>
                        <button type="submit" class="btn-submit" id="btn-submit-text">Salvar Alterações</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Configurações Globais (Drive + Webhook Discord) -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h2 class="modal-title">Configurações do Painel</h2>
            
            <div style="border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 20px; margin-bottom: 20px;">
                <h3 style="font-size: 13px; text-transform: uppercase; color: var(--accent); margin-bottom: 15px; letter-spacing: 0.5px;">Integração Discord</h3>
                <div class="form-group">
                    <label for="sync-webhook-url">URL do Webhook do Discord</label>
                    <input type="password" id="sync-webhook-url" placeholder="https://discord.com/api/webhooks/...">
                    <small style="color: var(--text-muted); font-size: 10px; margin-top: 4px; display: block;">
                        Salvo de forma compartilhada no Firestore. Se as regras do Firestore bloquearem, salvará localmente por segurança.
                    </small>
                </div>
            </div>

            <div>
                <h3 style="font-size: 13px; text-transform: uppercase; color: var(--accent); margin-bottom: 15px; letter-spacing: 0.5px;">Sincronização Google Drive</h3>
                <div class="form-group">
                    <label for="sync-folder-url">Link da Pasta do Google Drive</label>
                    <input type="url" id="sync-folder-url" placeholder="https://drive.google.com/drive/folders/...">
                </div>
                <div class="form-group">
                    <label for="sync-api-key">Chave de API do Google Cloud</label>
                    <input type="password" id="sync-api-key" placeholder="AIzaSy...">
                </div>
            </div>

            <div id="sync-status-msg" style="margin-bottom: 15px; font-size: 13px; color: var(--accent); display: none; line-height: 1.4;"></div>
            
            <div class="modal-buttons">
                <button type="button" class="btn-cancel" onclick="closeSettingsModal()">Fechar</button>
                <div class="modal-right-buttons">
                    <button type="button" class="btn-submit" style="background-color: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); color: var(--text-main);" onclick="saveSettingsOnly()">Salvar Ajustes</button>
                    <button type="button" class="btn-submit" id="btn-start-sync" onclick="startGoogleDriveSync()">Sincronizar Arquivos</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs (Versão Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDEejQS_JQMsd7D3-hXsC30UmYH1mJcHcw",
            authDomain: "doc-editor-c5af8.firebaseapp.com",
            projectId: "doc-editor-c5af8",
            storageBucket: "doc-editor-c5af8.firebasestorage.app",
            messagingSenderId: "340152893660",
            appId: "1:340152893660:web:794918522fff617c34b419",
            measurementId: "G-6G2W3C86XS"
        };

        // Inicializa o Firebase e o Firestore
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Armazenamento local dos cards
        let videosArray = [];
        let currentDragId = null;

        // Estado local do tracker para atualizações instantâneas (Otimistas)
        let localTrackerState = { count: 0, total: 8 };

        // Variável global para armazenar o Webhook compartilhado do banco de dados
        let sharedWebhookUrl = "";

        // Garante valores mínimos no LocalStorage para o fallback offline/local
        if (localStorage.getItem("accumulated_tracker_count") === null) {
            localStorage.setItem("accumulated_tracker_count", "0");
        }
        if (localStorage.getItem("accumulated_tracker_total") === null) {
            localStorage.setItem("accumulated_tracker_total", "8");
        }

        // Recupera o webhook ativo do banco de dados (Firestore) com fallback para o localStorage local
        function getDiscordWebhook() {
            return sharedWebhookUrl || localStorage.getItem("discord_webhook_url") || "";
        }

        // Sanitização de entradas contra vulnerabilidade XSS
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        // --- CARREGAMENTO EM TEMPO REAL DAS CONFIGURAÇÕES DO BANCO ---
        db.collection("settings").doc("drive_config").onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                sharedWebhookUrl = data.discordWebhookUrl || "";
                if (data.folderUrl) {
                    document.getElementById('sync-folder-url').value = data.folderUrl;
                    localStorage.setItem("google_drive_folder_url", data.folderUrl);
                }
                if (data.apiKey) {
                    document.getElementById('sync-api-key').value = data.apiKey;
                    localStorage.setItem("google_drive_api_key", data.apiKey);
                }
                if (data.discordWebhookUrl) {
                    document.getElementById('sync-webhook-url').value = data.discordWebhookUrl;
                    localStorage.setItem("discord_webhook_url", data.discordWebhookUrl);
                }
            } else {
                // Caso o documento não exista no banco de dados, tenta recuperar do armazenamento local do navegador
                const localFolder = localStorage.getItem("google_drive_folder_url") || "";
                const localApiKey = localStorage.getItem("google_drive_api_key") || "";
                const localWebhook = localStorage.getItem("discord_webhook_url") || "";

                if (localFolder) document.getElementById('sync-folder-url').value = localFolder;
                if (localApiKey) document.getElementById('sync-api-key').value = localApiKey;
                if (localWebhook) document.getElementById('sync-webhook-url').value = localWebhook;
            }
        }, (err) => {
            console.warn("Acesso ao Firestore para drive_config restrito. Usando local:", err.message);
            // Fallback imediato para modo local se houver restrição de segurança no banco
            const localFolder = localStorage.getItem("google_drive_folder_url") || "";
            const localApiKey = localStorage.getItem("google_drive_api_key") || "";
            const localWebhook = localStorage.getItem("discord_webhook_url") || "";

            if (localFolder) document.getElementById('sync-folder-url').value = localFolder;
            if (localApiKey) document.getElementById('sync-api-key').value = localApiKey;
            if (localWebhook) document.getElementById('sync-webhook-url').value = localWebhook;
        });

        // --- SISTEMA DE META ACUMULADA ---
        const trackerRef = db.collection("settings").doc("accumulated_tracker");

        // Escuta em tempo real o Firestore, atualizando a UI e o backup local
        trackerRef.onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                const count = typeof data.count === 'number' ? data.count : 0;
                const total = typeof data.total === 'number' ? data.total : 8;
                updateTrackerUI(count, total);
                localStorage.setItem("accumulated_tracker_count", count.toString());
                localStorage.setItem("accumulated_tracker_total", total.toString());
            } else {
                trackerRef.set({ count: 0, total: 8 }).catch(err => {
                    console.warn("Regras do Firebase bloqueiam gravação de meta inicial, usando local:", err);
                });
                const localCount = parseInt(localStorage.getItem("accumulated_tracker_count") || "0", 10);
                const localTotal = parseInt(localStorage.getItem("accumulated_tracker_total") || "8", 10);
                updateTrackerUI(localCount, localTotal);
            }
        }, (error) => {
            console.error("Erro ao escutar dados de meta do Firestore (Alternando para fallback local):", error);
            const localCount = parseInt(localStorage.getItem("accumulated_tracker_count") || "0", 10);
            const localTotal = parseInt(localStorage.getItem("accumulated_tracker_total") || "8", 10);
            updateTrackerUI(localCount, localTotal);
        });

        // Modifica o contador (Otimista na UI -> Tenta gravar no Firebase)
        function changeTrackerCount(delta) {
            const oldCount = localTrackerState.count;
            const total = localTrackerState.total;
            const newCount = Math.max(0, Math.min(total, oldCount + delta));

            if (newCount === oldCount) return;

            // Altera na interface instantaneamente
            updateTrackerUI(newCount, total);
            localStorage.setItem("accumulated_tracker_count", newCount.toString());

            // Tenta propagar em background
            trackerRef.set({ count: newCount, total: total }, { merge: true })
                .then(() => {
                    sendDiscordNotification(oldCount, newCount, total);
                })
                .catch((err) => {
                    console.warn("Firestore bloqueado. O progresso foi mantido apenas no navegador local:", err);
                });
        }

        // Incrementa limite mensal (Otimista na UI -> Tenta gravar no Firebase)
        function addNewMonthQuota() {
            if (confirm("Adicionar mais +8 vídeos ao seu saldo de metas?")) {
                const oldTotal = localTrackerState.total;
                const newTotal = oldTotal + 8;
                const count = localTrackerState.count;

                // Altera na interface instantaneamente
                updateTrackerUI(count, newTotal);
                localStorage.setItem("accumulated_tracker_total", newTotal.toString());

                // Tenta propagar em background
                trackerRef.set({ total: newTotal, count: count }, { merge: true })
                    .then(() => {
                        sendDiscordQuotaNotification(oldTotal, newTotal);
                    })
                    .catch((err) => {
                        console.warn("Firestore bloqueado. Nova cota salva apenas localmente:", err);
                    });
            }
        }

        // Notificações assíncronas do Discord Webhook
        async function sendDiscordNotification(oldCount, newCount, total) {
            const webhookUrl = getDiscordWebhook();
            if (!webhookUrl) return;
            try {
                const timeString = new Date().toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" });
                const isIncrease = newCount > oldCount;
                
                const payload = {
                    username: "Painel Doc's Edit",
                    avatar_url: "https://cdn-icons-png.flaticon.com/512/3172/3172432.png",
                    embeds: [{
                        title: isIncrease ? "📈 +1 Vídeo Entregue" : "📉 -1 Vídeo Revertido",
                        description: `O progresso de vídeos foi atualizado no painel!`,
                        color: isIncrease ? 65280 : 15548997,
                        fields: [
                            { name: "Saldo do Contrato", value: `**${newCount} / ${total} Reels**`, inline: true },
                            { name: "Alteração", value: `${oldCount} ➔ **${newCount}**`, inline: true },
                            { name: "Data / Horário", value: `${timeString}`, inline: false }
                        ],
                        footer: { text: "Doc's Edit Flow System" }
                    }]
                };

                const res = await fetch(webhookUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) console.warn("Resposta anormal ao enviar webhook ao Discord:", res.status);
            } catch (err) {
                console.error("Falha ao propagar notificação ao Discord:", err);
            }
        }

        async function sendDiscordQuotaNotification(oldTotal, newTotal) {
            const webhookUrl = getDiscordWebhook();
            if (!webhookUrl) return;
            try {
                const timeString = new Date().toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" });

                const payload = {
                    username: "Painel Doc's Edit",
                    avatar_url: "https://cdn-icons-png.flaticon.com/512/3172/3172432.png",
                    embeds: [{
                        title: "📅 Novo Mês Adicionado (+8 Vídeos)",
                        description: `Foi adicionada a cota de mais um mês ao painel!`,
                        color: 38912,
                        fields: [
                            { name: "Nova Meta Total", value: `**${newTotal} Reels**`, inline: true },
                            { name: "Data / Horário", value: `${timeString}`, inline: false }
                        ],
                        footer: { text: "Doc's Edit Flow System" }
                    }]
                };

                const res = await fetch(webhookUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) console.warn("Resposta anormal ao enviar webhook ao Discord:", res.status);
            } catch (err) {
                console.error("Falha ao propagar notificação de nova cota ao Discord:", err);
            }
        }

        function updateTrackerUI(count, total) {
            localTrackerState.count = count;
            localTrackerState.total = total;

            document.getElementById('tracker-current').textContent = count;
            document.getElementById('tracker-total').textContent = total;
            const percentage = total > 0 ? (count / total) * 100 : 0;
            document.getElementById('tracker-bar').style.width = Math.min(percentage, 100) + "%";

            const today = new Date();
            const lastDayOfMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0);
            const daysRemaining = lastDayOfMonth.getDate() - today.getDate();
            const videosRemaining = total - count;

            const alertElement = document.getElementById('tracker-alert-msg');

            if (videosRemaining <= 0) {
                alertElement.style.display = "block";
                alertElement.style.color = "#34d399";
                alertElement.textContent = "🎉 Meta do contrato concluída!";
            } else if (daysRemaining <= 7) {
                alertElement.style.display = "block";
                alertElement.style.color = "#fbbf24";
                alertElement.textContent = `⚠️ Faltam ${daysRemaining} dias e ${videosRemaining} vídeo(s) para fechar o mês!`;
            } else {
                alertElement.style.display = "none";
            }
        }

        // --- SISTEMA DE CARDS (SINCRONIZAÇÃO E ORDENAÇÃO) ---
        db.collection("videos").onSnapshot((snapshot) => {
            videosArray = [];
            snapshot.forEach((doc) => {
                videosArray.push({ id: doc.id, ...doc.data() });
            });

            // Ordenação local estável
            videosArray.sort((a, b) => {
                const parseDate = (val) => {
                    if (!val) return new Date(0);
                    if (typeof val.toDate === 'function') return val.toDate();
                    if (val.seconds) return new Date(val.seconds * 1000);
                    return new Date(val);
                };
                return parseDate(a.createdAt) - parseDate(b.createdAt);
            });

            renderBoard();
        }, (error) => {
            console.error("Erro na leitura de documentos do banco de dados:", error);
        });

        function renderBoard() {
            const columns = {
                todo: document.getElementById('list-todo'),
                progress: document.getElementById('list-progress'),
                done: document.getElementById('list-done')
            };

            Object.values(columns).forEach(col => col.innerHTML = '');

            const counts = { todo: 0, progress: 0, done: 0 };

            videosArray.forEach(video => {
                const statusKey = (video.status && columns[video.status]) ? video.status : 'todo';
                counts[statusKey]++;

                let creationDateStr = "";
                if (video.createdAt) {
                    const parsed = typeof video.createdAt.toDate === 'function' ? video.createdAt.toDate() : new Date(video.createdAt);
                    creationDateStr = parsed.toLocaleDateString("pt-BR");
                } else {
                    creationDateStr = "N/A";
                }

                const safeTitle = escapeHTML(video.title);
                const safeDesc = escapeHTML(video.desc);
                const safeDriveUrl = escapeHTML(video.driveUrl);
                const safeFinalUrl = escapeHTML(video.finalUrl);

                // Detecta se é arquivo compactado para mudar layout do link do Drive
                const isArchive = safeTitle.toLowerCase().endsWith('.rar') || safeTitle.toLowerCase().endsWith('.zip') || safeTitle.toLowerCase().endsWith('.7z');
                const driveBadgeIcon = isArchive ? 'fa-solid fa-file-zipper' : 'fa-brands fa-google-drive';
                const driveBadgeText = isArchive ? 'Baixar Pacote RAR/ZIP' : 'Baixar Bruto';
                const driveBadgeClass = isArchive ? 'archive-pack' : 'drive';

                const cardHTML = `
                    <div class="card" draggable="true" ondragstart="dragStart(event, '${video.id}')" id="card-${video.id}">
                        <h3 class="card-title">${safeTitle}</h3>
                        <p class="card-desc">${safeDesc}</p>
                        <div class="card-links">
                            <a href="${safeDriveUrl}" target="_blank" class="link-badge ${driveBadgeClass}" rel="noopener noreferrer">
                                <i class="${driveBadgeIcon}"></i> ${driveBadgeText}
                            </a>
                            ${safeFinalUrl ? `
                                <a href="${safeFinalUrl}" target="_blank" class="link-badge final" rel="noopener noreferrer">
                                    <i class="fa-solid fa-circle-check"></i> Vídeo Pronto
                                </a>
                            ` : ''}
                        </div>
                        <div class="card-footer">
                            <span>Adicionado: ${creationDateStr}</span>
                            <div class="card-actions">
                                <button class="btn-action edit" onclick="openModal('edit', '${video.id}')" title="Configurações do Vídeo">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                columns[statusKey].insertAdjacentHTML('beforeend', cardHTML);
            });

            document.getElementById('count-todo').textContent = counts.todo;
            document.getElementById('count-progress').textContent = counts.progress;
            document.getElementById('count-done').textContent = counts.done;
        }

        // --- INTERATIVIDADE DRAG & DROP ---
        function dragStart(ev, id) {
            currentDragId = id;
            if(ev.dataTransfer) {
                ev.dataTransfer.setData("text/plain", id);
                ev.dataTransfer.effectAllowed = "move";
            }
        }

        // Modificado para disparar animação de hover ao arrastar cards
        function allowDrop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add('drag-over');
        }

        function dragLeave(ev) {
            ev.currentTarget.classList.remove('drag-over');
        }

        function drop(ev, newStatus) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');
            
            if (currentDragId) {
                db.collection("videos").doc(currentDragId).update({
                    status: newStatus
                }).catch(err => {
                    console.error("Erro ao persistir transição de card:", err);
                });
                currentDragId = null;
            }
        }

        // --- GERENCIAMENTO DOS MODAIS ---
        const modal = document.getElementById('video-modal');
        const settingsModal = document.getElementById('settings-modal');

            modal.classList.add('active');
            
            const finalLinkGroup = document.getElementById('final-link-group');

            } else {
                document.getElementById('modal-title-text').textContent = 'Novo Vídeo';
                document.getElementById('btn-submit-text').textContent = 'Adicionar';

                if (deleteBtn) deleteBtn.style.display = 'none';

                document.getElementById('video-id').value = '';
                document.getElementById('video-name').value = '';

                document.getElementById('video-desc').value = '';

        function closeModal() {
            modal.classList.remove('active');
        }

        function openSettingsModal() {
            settingsModal.classList.add('active');
            document.getElementById('sync-status-msg').style.display = 'none';
            
            // Popula os campos usando as variáveis centralizadas e compartilhadas
            document.getElementById('sync-webhook-url').value = getDiscordWebhook();

            db.collection("settings").doc("drive_config").get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.folderUrl) document.getElementById('sync-folder-url').value = data.folderUrl;
                    if (data.apiKey) document.getElementById('sync-api-key').value = data.apiKey;
                    if (data.discordWebhookUrl) document.getElementById('sync-webhook-url').value = data.discordWebhookUrl;
                }
            }).catch(err => {
                console.warn("Erro ao ler credenciais compartilhadas do Drive:", err);
            });
        }

        function closeSettingsModal() {
            settingsModal.classList.remove('active');
        }

        // Salva as configurações compartilhadas no Firestore com fallback resiliente para LocalStorage se houver bloqueio de permissão
        function saveSettingsOnly() {
            const webhookVal = document.getElementById('sync-webhook-url').value.trim();
            const folderVal = document.getElementById('sync-folder-url').value.trim();
            const apiKeyVal = document.getElementById('sync-api-key').value.trim();

            // Salva preventivamente no navegador (Backup local imediato)
            localStorage.setItem("discord_webhook_url", webhookVal);
            localStorage.setItem("google_drive_folder_url", folderVal);
            localStorage.setItem("google_drive_api_key", apiKeyVal);

            // Tenta propagar remotamente para compartilhamento com o editor
            db.collection("settings").doc("drive_config").set({
                folderUrl: folderVal,
                apiKey: apiKeyVal,
                discordWebhookUrl: webhookVal
            }, { merge: true })
            .then(() => {
                const statusMsg = document.getElementById('sync-status-msg');
                statusMsg.style.display = "block";
                statusMsg.style.color = "var(--accent)";
                statusMsg.textContent = "Ajustes salvos e compartilhados no Firestore!";
                setTimeout(() => { closeSettingsModal(); }, 1200);
            })
            .catch(err => {
                console.warn("Firestore bloqueado por Regras de Segurança. Ajustes mantidos localmente no navegador:", err);
                const statusMsg = document.getElementById('sync-status-msg');
                statusMsg.style.display = "block";
                statusMsg.style.color = "#fbbf24";
                statusMsg.textContent = "Salvo localmente! (Firestore bloqueou o compartilhamento). Ajuste as 'Rules' se quiser compartilhar.";
                setTimeout(() => { closeSettingsModal(); }, 2500);
            });
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            
            const id = document.getElementById('video-id').value;
            const title = document.getElementById('video-name').value;
            const driveUrl = document.getElementById('video-drive').value;
            const desc = document.getElementById('video-desc').value;
            const finalUrl = document.getElementById('video-final').value;

            if (id) {
                db.collection("videos").doc(id).update({
                    title: title,
                    driveUrl: driveUrl,
                    desc: desc,

                }).then(() => {

                }).catch((err) => {
                    console.error("Erro ao atualizar o card de vídeo:", err);
                });
            } else {
                db.collection("videos").add({
                    title: title,
                    driveUrl: driveUrl,
                    desc: desc,
                    finalUrl: null,
                    status: 'todo',
                    createdAt: new Date().toISOString()
                }).then(() => {
                    closeModal();
                }).catch((err) => {
                    console.error("Erro ao registrar novo vídeo no Firestore:", err);
                });

        }

        function deleteVideoFromModal() {
            const id = document.getElementById('video-id').value;
            if (id && confirm("Deseja deletar este projeto permanentemente?")) {
                db.collection("videos").doc(id).delete().then(() => {
                    closeModal();
                }).catch((err) => {
                    console.error("Erro ao deletar o card de vídeo:", err);
                });
            }
        }

        // --- INTEGRAÇÃO COM A API DO GOOGLE DRIVE ---
        function extractFolderId(url) {
            const matches = url.match(/folders\/([a-zA-Z0-9-_]+)/);
            return matches ? matches[1] : null;
        }

        async function startGoogleDriveSync() {
            const urlInput = document.getElementById('sync-folder-url').value.trim();
            const apiKey = document.getElementById('sync-api-key').value.trim();
            const webhookVal = document.getElementById('sync-webhook-url').value.trim();
            const statusMsg = document.getElementById('sync-status-msg');
            const syncBtn = document.getElementById('btn-start-sync');

            if (!urlInput || !apiKey) {
                alert("Por favor, preencha o link da pasta e forneça sua Chave de API do Google.");
                return;
            }

            const folderId = extractFolderId(urlInput);
            if (!folderId) {
                alert("URL inválida. Não foi possível identificar o ID da pasta do Google Drive.");
                return;
            }

            // Salva cópia preventiva de configurações
            localStorage.setItem("discord_webhook_url", webhookVal);
            localStorage.setItem("google_drive_folder_url", urlInput);
            localStorage.setItem("google_drive_api_key", apiKey);

            db.collection("settings").doc("drive_config").set({
                folderUrl: urlInput,
                apiKey: apiKey,
                discordWebhookUrl: webhookVal
            }, { merge: true }).catch(err => {
                console.warn("Falha ao salvar preferências de pasta remotamente no banco:", err.message);
            });

            statusMsg.style.display = "block";
            statusMsg.style.color = "var(--text-main)";
            statusMsg.textContent = "Conectando ao Google Drive e listando arquivos...";
            syncBtn.disabled = true;

            try {
                // Montagem da query com codificação de caracteres segura e parâmetros para drives compartilhados/Workspace
                const queryParams = new URLSearchParams({
                    q: `'${folderId}' in parents and trashed = false`,
                    fields: 'files(id,name,webViewLink,mimeType)',
                    key: apiKey,
                    supportsAllDrives: 'true',
                    includeItemsFromAllDrives: 'true'
                });

                const apiURL = `https://www.googleapis.com/drive/v3/files?${queryParams.toString()}`;
                
                const response = await fetch(apiURL);
                if (!response.ok) {
                    const errorDetails = await response.json().catch(() => ({}));
                    throw new Error(errorDetails.error?.message || `Servidor retornou status HTTP ${response.status}`);
                }

                const data = await response.json();
                const allFiles = data.files || [];

                // Exclui subpastas do Drive
                const driveFiles = allFiles.filter(file => file.mimeType !== 'application/vnd.google-apps.folder');

                if (driveFiles.length === 0) {
                    statusMsg.style.color = "#fbbf24";
                    statusMsg.textContent = "A pasta está vazia ou não contém arquivos legíveis (como vídeos ou pacotes .rar).";
                    syncBtn.disabled = false;
                    return;
                }

                let importCount = 0;

                for (const file of driveFiles) {
                    const fileLink = file.webViewLink || `https://drive.google.com/open?id=${file.id}`;
                    
                    const alreadyExists = videosArray.some(vid => {
                        const existingUrl = vid.driveUrl || '';
                        return existingUrl.includes(file.id) || vid.title.trim() === file.name.trim();
                    });

                    if (!alreadyExists) {
                        await db.collection("videos").add({
                            title: file.name,
                            driveUrl: fileLink,
                            desc: "Vídeo importado automaticamente via sincronização do Google Drive.",
                            finalUrl: null,
                            status: 'todo',
                            createdAt: new Date().toISOString()
                        });
                        importCount++;
                    }
                }

                statusMsg.style.color = "var(--accent)";
                statusMsg.textContent = `Sincronização concluída. ${importCount} novo(s) arquivo(s) (incluindo .rar) importado(s) para a lista "A Fazer".`;
            } catch (err) {
                console.error("Falha na sincronização com o Drive:", err);
                statusMsg.style.color = "#f87171";
                statusMsg.textContent = `Erro ao sincronizar: ${err.message}`;
            } finally {
                syncBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
